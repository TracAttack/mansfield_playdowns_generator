<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>28-Team Tournament Bracket</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #fff; color: #111827; }
  input, select, textarea, button { font-family: inherit; }
  button:focus-visible { outline: 2px solid #185FA5; outline-offset: 2px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useMemo, useEffect, useRef } = React;

const SHIFTS = ["Tue Early","Tue Late","Wed Early","Wed Late","Thr Early","Thr Late"];
const SHIFT_BG     = {"Tue Early":"#EEEDFE","Tue Late":"#E6F1FB","Wed Early":"#EAF3DE","Wed Late":"#E1F5EE","Thr Early":"#FAECE7","Thr Late":"#FAEEDA"};
const SHIFT_BORDER = {"Tue Early":"#534AB7","Tue Late":"#185FA5","Wed Early":"#3B6D11","Wed Late":"#0F6E56","Thr Early":"#993C1D","Thr Late":"#854F0B"};
const SHIFT_TEXT   = {"Tue Early":"#3C3489","Tue Late":"#0C447C","Wed Early":"#27500A","Wed Late":"#085041","Thr Early":"#712B13","Thr Late":"#633806"};

const BYE_SEEDS   = [1,4,3,2];
const SLOT_UPPERS = [[16,9,8],[13,5,12],[14,6,11],[15,10,7]];
const SLOT_LOWERS = [[17,24,25],[20,28,21],[19,27,22],[18,23,26]];
const ALL_SLOTS   = [16,9,8,13,5,12,14,6,11,15,10,7,17,24,25,20,28,21,19,27,22,18,23,26];

const SLOT_MAP = {};
SLOT_UPPERS.forEach((row,qi) => row.forEach((s,si) => { SLOT_MAP[s] = {qi,si,isUpper:true}; }));
SLOT_LOWERS.forEach((row,qi) => row.forEach((s,si) => { SLOT_MAP[s] = {qi,si,isUpper:false}; }));

const S = {
  btnSm:   {padding:"5px 12px",fontSize:11,borderRadius:6,background:"#f3f4f6",border:"1px solid #d1d5db",color:"#111827",cursor:"pointer"},
  primary: {padding:"8px 20px",fontSize:13,borderRadius:6,fontWeight:500,border:"none",cursor:"pointer",background:"#111827",color:"#fff"},
  disabled:{padding:"8px 20px",fontSize:13,borderRadius:6,fontWeight:500,border:"none",cursor:"not-allowed",background:"#d1d5db",color:"#9ca3af"},
  banner:  (bg,bd,fc) => ({marginBottom:10,padding:"8px 12px",borderRadius:6,background:bg,border:`1px solid ${bd}`,fontSize:12,color:fc})
};

const freshQuads = () => BYE_SEEDS.map(b => ({bye:b, pairs:[[0,0],[0,0],[0,0]]}));

// ── Parse ─────────────────────────────────────────────────────────────────────
function parseShift(raw) {
  if (!raw) return "";
  const s = raw.toLowerCase().replace(/[^a-z ]/g,"").trim();
  if (s.includes("tue") && s.includes("early")) return "Tue Early";
  if (s.includes("tue") && s.includes("late"))  return "Tue Late";
  if (s.includes("wed") && s.includes("early")) return "Wed Early";
  if (s.includes("wed") && s.includes("late"))  return "Wed Late";
  if ((s.includes("thr")||s.includes("thu")) && s.includes("early")) return "Thr Early";
  if ((s.includes("thr")||s.includes("thu")) && s.includes("late"))  return "Thr Late";
  return "";
}
function parsePaste(text) {
  const lines = text.trim().split(/\r?\n/).filter(l => l.trim());
  const teams = [];
  for (let i = 0; i < Math.min(lines.length, 28); i++) {
    let line = lines[i].replace(/^\d+[\.\)\:\-\s]+/,"").trim();
    let parts = line.split("\t").map(p => p.trim()).filter(Boolean);
    if (parts.length < 2) parts = line.split(/\s{2,}/).map(p => p.trim()).filter(Boolean);
    let name = "", shift = "";
    if (parts.length >= 2) {
      const l1 = parseShift(parts[parts.length-1]);
      if (l1) { shift=l1; name=parts.slice(0,-1).join(" ").trim(); }
      else if (parts.length >= 3) {
        const l2 = parseShift(parts.slice(-2).join(" "));
        if (l2) { shift=l2; name=parts.slice(0,-2).join(" ").trim(); }
        else name = parts.join(" ");
      } else name = parts.join(" ");
    } else {
      const sh = parseShift(line);
         if (sh) { shift=sh; name=line.replace(/\b(tue|tues|tuesday|wed|wednesday|thr|thu|thursday|early|late)\b/gi,"").replace(/\s+/g," ").trim(); }
      else name = line;
    }
    name = name.replace(/\s*\[\d+\]\s*$/,"").replace(/\s*\(\d+\)\s*$/,"").trim();
    teams.push({seed:i+1, name, shift});
  }
  while (teams.length < 28) teams.push({seed:teams.length+1, name:"", shift:""});
  return teams;
}
function validate(teams) {
  const errs = {};
  teams.forEach(t => { errs[t.seed] = []; });
  teams.forEach(t => {
    if (!t.name.trim()) errs[t.seed].push("Name missing");
    if (!t.shift)       errs[t.seed].push("Shift missing");
  });
  const seen = {};
  teams.forEach(t => {
    const k = t.name.trim().toLowerCase();
    if (!k) return;
    if (seen[k] !== undefined) { errs[t.seed].push("Dup of #"+seen[k]); errs[seen[k]].push("Dup of #"+t.seed); }
    else seen[k] = t.seed;
  });
  return errs;
}
const getShift = (teams, seed) => { const t = teams.find(x => x.seed===seed); return t ? t.shift||"" : ""; };
const getName  = (teams, seed) => { const t = teams.find(x => x.seed===seed); return t ? t.name : ""; };

// ── Scoring ───────────────────────────────────────────────────────────────────
const isGroupB = si => si===1||si===2;

function enrichQuads(quads, teams) {
  return quads.map(q => ({
    bye: q.bye,
    byeShift: getShift(teams, q.bye),
    pairs: q.pairs,
    pairShifts: q.pairs.map(p => [p[0]?getShift(teams,p[0]):"", p[1]?getShift(teams,p[1]):""])
  }));
}

function scoreSlot(eq, qi, si, sh, isUpper) {
  if (isUpper  && eq[qi].pairs[si][0] !== 0) return null;
  if (!isUpper && eq[qi].pairs[si][1] !== 0) return null;
  if (!sh) return {r1:0,r16:0,qf:0};
  const selfInB = isGroupB(si);
  let r1=0, r16=0, qf=0;
  const pSh = isUpper ? eq[qi].pairShifts[si][1] : eq[qi].pairShifts[si][0];
  if (pSh === sh) r1 = 1;
  for (let idx=0; idx<3; idx++) {
    if (idx===si) continue;
    const same = selfInB === isGroupB(idx);
    if (eq[qi].pairShifts[idx][0]===sh) { if(same) r16=1; else qf=1; }
    if (eq[qi].pairShifts[idx][1]===sh) { if(same) r16=1; else qf=1; }
  }
  if (eq[qi].byeShift===sh) { if(selfInB) qf=1; else r16=1; }
  return {r1, r16, qf};
}

const cmpScore = (a,b) => a.r1!==b.r1 ? a.r1-b.r1 : a.r16!==b.r16 ? a.r16-b.r16 : a.qf-b.qf;

function getCandidates(quads, teams, teamSeed) {
  const sm = SLOT_MAP[teamSeed];
  const isUpper = sm ? sm.isUpper : teamSeed<=16;
  const sh = getShift(teams, teamSeed);
  const hqi = sm ? sm.qi : -1, hsi = sm ? sm.si : -1;
  const eq = enrichQuads(quads, teams);
  const out = [];
  for (let qi=0; qi<4; qi++) {
    for (let si=0; si<3; si++) {
      const sc = scoreSlot(eq, qi, si, sh, isUpper);
      if (!sc) continue;
      const slotNum = isUpper ? SLOT_UPPERS[qi][si] : SLOT_LOWERS[qi][si];
      const selfInB = isGroupB(si);
      const conflicts = [];
      const pSh   = isUpper ? eq[qi].pairShifts[si][1] : eq[qi].pairShifts[si][0];
      const pSeed = isUpper ? eq[qi].pairs[si][1]       : eq[qi].pairs[si][0];
      if (pSh===sh && pSeed) conflicts.push("R1#"+pSeed);
      for (let idx=0; idx<3; idx++) {
        if (idx===si) continue;
        const tag = (selfInB===isGroupB(idx)) ? "R16" : "QF";
        if (eq[qi].pairShifts[idx][0]===sh && eq[qi].pairs[idx][0]) conflicts.push(tag+"#"+eq[qi].pairs[idx][0]);
        if (eq[qi].pairShifts[idx][1]===sh && eq[qi].pairs[idx][1]) conflicts.push(tag+"#"+eq[qi].pairs[idx][1]);
      }
      if (eq[qi].byeShift===sh) conflicts.push((selfInB?"QF":"R16")+" bye#"+eq[qi].bye);
      out.push({qi,si,isUpper,slotNum,r1:sc.r1,r16:sc.r16,qf:sc.qf,
        isHome:qi===hqi&&si===hsi,
        reason:conflicts.length===0?"No conflicts":conflicts.join(", ")});
    }
  }
  out.sort((a,b) => { const c=cmpScore(a,b); return c!==0?c:Math.abs(a.slotNum-teamSeed)-Math.abs(b.slotNum-teamSeed); });
  return out;
}

function applyPlacement(quads, teamSeed, qi, si, isUpper) {
  return quads.map((q,qIdx) => {
    if (qIdx!==qi) return q;
    return {bye:q.bye, pairs:q.pairs.map((p,pIdx) => {
      if (pIdx!==si) return [p[0],p[1]];
      return isUpper ? [teamSeed,p[1]] : [p[0],teamSeed];
    })};
  });
}

// ── DFS ───────────────────────────────────────────────────────────────────────
function findNextSolution(stack, quads, teams) {
  while (true) {
    const step = stack.length;
    if (step >= ALL_SLOTS.length) return {stack, quads};
    const ts = ALL_SLOTS[step];
    const cands = getCandidates(quads, teams, ts);
    const ci = cands.findIndex(c => c.r1===0 && c.r16===0);
    if (ci !== -1) {
      const c = cands[ci];
      const nq = applyPlacement(quads, ts, c.qi, c.si, c.isUpper);
      stack = stack.concat([{teamSeed:ts, candidates:cands, chosenIdx:ci, quadsAfter:nq}]);
      quads = nq;
    } else {
      let found = false;
      while (stack.length > 0) {
        const popped = stack.slice(0, stack.length-1);
        let rq = freshQuads();
        popped.forEach(f => { const ch=f.candidates[f.chosenIdx]; rq=applyPlacement(rq,f.teamSeed,ch.qi,ch.si,ch.isUpper); });
        const frame = stack[stack.length-1];
        const fc = getCandidates(rq, teams, frame.teamSeed);
        const ni = fc.findIndex((c,i) => i>frame.chosenIdx && c.r1===0 && c.r16===0);
        if (ni !== -1) {
          const ch2=fc[ni];
          const nq2=applyPlacement(rq,frame.teamSeed,ch2.qi,ch2.si,ch2.isUpper);
          stack = popped.concat([{teamSeed:frame.teamSeed,candidates:fc,chosenIdx:ni,quadsAfter:nq2}]);
          quads = nq2; found = true; break;
        }
        stack = popped;
      }
      if (!found) return null;
    }
  }
}

function advancePastSolution(stack, teams) {
  while (stack.length > 0) {
    const popped = stack.slice(0, stack.length-1);
    let rq = freshQuads();
    popped.forEach(f => { const ch=f.candidates[f.chosenIdx]; rq=applyPlacement(rq,f.teamSeed,ch.qi,ch.si,ch.isUpper); });
    const frame = stack[stack.length-1];
    const fc = getCandidates(rq, teams, frame.teamSeed);
    const ni = fc.findIndex((c,i) => i>frame.chosenIdx && c.r1===0 && c.r16===0);
    if (ni !== -1) {
      const ch2=fc[ni];
      const nq2=applyPlacement(rq,frame.teamSeed,ch2.qi,ch2.si,ch2.isUpper);
      return findNextSolution(popped.concat([{teamSeed:frame.teamSeed,candidates:fc,chosenIdx:ni,quadsAfter:nq2}]), nq2, teams);
    }
    stack = popped;
  }
  return null;
}

// ── Fidelity ──────────────────────────────────────────────────────────────────
function fidelityPts(d) {
  if (d === 0) return 1;
  if (d <= 3)  return 0.5;
  if (d === 4) return 0.3;
  if (d === 5) return 0.2;
  if (d === 6) return 0.1;
  return 0;
}

function seedFidelityScore(quads, teams) {
  const scores = [];
  BYE_SEEDS.forEach(b => scores.push({seed:b,name:getName(teams,b),slotNum:b,diff:0,points:1}));
  for (let qi=0; qi<4; qi++) {
    for (let si=0; si<3; si++) {
      const u=quads[qi].pairs[si][0], l=quads[qi].pairs[si][1];
      const su=SLOT_UPPERS[qi][si], sl=SLOT_LOWERS[qi][si];
      if (u) { const d=Math.abs(u-su); scores.push({seed:u,name:getName(teams,u),slotNum:su,diff:d,points:fidelityPts(d)}); }
      if (l) { const d=Math.abs(l-sl); scores.push({seed:l,name:getName(teams,l),slotNum:sl,diff:d,points:fidelityPts(d)}); }
    }
  }
  scores.sort((a,b) => a.seed-b.seed);
  const total = scores.reduce((s,r) => s+r.points, 0);
  return {scores, total, max:28};
}

// ── SVG ───────────────────────────────────────────────────────────────────────
const SVG_W=900,BOX_W=115,BOX_H=26,MID=13,PAIR_SEP=4,GROUP_SEP=20;
const LINE_CLR="#374151",LINE_W=2.2,HL_CLR="#1D4ED8";
const L_R1X=4,L_R16X=128,L_QFX=260,L_SFX=392;
const R_R1X=SVG_W-L_R1X-BOX_W,R_R16X=SVG_W-L_R16X-BOX_W;
const R_QFX=SVG_W-L_QFX-BOX_W,R_SFX=SVG_W-L_SFX-BOX_W;
const FINAL_W=BOX_W+20,FINAL_X=(SVG_W-FINAL_W)/2;

function halfLayout(base) {
  const rowH=BOX_H+PAIR_SEP,pairH=rowH*2;
  const p=[0,1,2].map(i => base+i*(pairH+GROUP_SEP));
  const pmid=p.map(py => py+BOX_H+PAIR_SEP/2);
  const byeY=p[0],g1Y=pmid[0]-MID,g2Y=pmid[1]-MID,g3Y=pmid[2]-MID;
  const qf1Y=(byeY+MID+g1Y+MID)/2-MID,qf2Y=(g2Y+MID+g3Y+MID)/2-MID;
  const sfY=(qf1Y+MID+qf2Y+MID)/2-MID;
  return {p,pmid,byeY,g1Y,g2Y,g3Y,qf1Y,qf2Y,sfY};
}
const TOP_LAY=halfLayout(34),BOT_LAY=halfLayout(434);
const FINAL_Y=(TOP_LAY.sfY+MID+BOT_LAY.sfY+MID)/2-MID;
const SVG_H=Math.max(BOT_LAY.p[2]+BOX_H*2+PAIR_SEP,BOT_LAY.sfY+BOX_H)+48;
const QUAD_CFG=[{side:"left",lay:TOP_LAY},{side:"left",lay:BOT_LAY},{side:"right",lay:BOT_LAY},{side:"right",lay:TOP_LAY}];

const SvgLine = ({k,x1,y1,x2,y2}) => <line key={k} x1={x1} y1={y1} x2={x2} y2={y2} stroke={LINE_CLR} strokeWidth={LINE_W} strokeLinecap="square"/>;

function SlotBox({k,slotNum,assigned,bye,x,y,hl,teams}) {
  const t = assigned ? teams.find(t=>t.seed===assigned) : null;
  const sh=t?t.shift:"", moved=assigned&&assigned!==slotNum;
  const bg=t?(sh?SHIFT_BG[sh]:"#F9FAFB"):"#F3F4F6";
  const bd=hl?HL_CLR:(t?(sh?SHIFT_BORDER[sh]:"#D1D5DB"):"#E5E7EB");
  const fc=t?(sh?SHIFT_TEXT[sh]:"#111827"):"#9CA3AF";
  const sub=sh?SHIFT_TEXT[sh]+"99":"#9CA3AF";
  const bbg=t?(sh?SHIFT_BORDER[sh]:"#6B7280"):"#9CA3AF";
  return (
    <g key={k}>
      <rect x={x} y={y} width={BOX_W} height={BOX_H} rx={3} fill={bg} stroke={bd} strokeWidth={hl?2:1}/>
      <rect x={x} y={y} width={18} height={BOX_H} rx={0} fill={bbg} opacity={t?0.85:0.4}/>
      <rect x={x+3} y={y} width={15} height={BOX_H} rx={0} fill={bbg} opacity={t?0.85:0.4}/>
      <text x={x+9} y={y+MID} textAnchor="middle" dominantBaseline="central" fontSize={8} fontWeight="bold" fill="#fff" fontFamily="sans-serif">{slotNum}</text>
      {t ? <>
        <text x={x+23} y={y+9} textAnchor="start" dominantBaseline="central" fontSize={9} fontWeight={hl?"bold":"500"} fill={fc} fontFamily="sans-serif">{t.name+(bye?" BYE":"")}</text>
        <text x={x+23} y={y+19} textAnchor="start" dominantBaseline="central" fontSize={7} fill={sub} fontFamily="sans-serif">{moved?`team#${assigned} →slot${slotNum}`:`team#${assigned}`}</text>
      </> : <text x={x+23} y={y+MID} textAnchor="start" dominantBaseline="central" fontSize={8} fill={fc} fontFamily="sans-serif">empty</text>}
    </g>
  );
}

function FutureBox({k,x,y,w,label}) {
  w = w||BOX_W;
  return (
    <g key={k}>
      <rect x={x} y={y} width={w} height={BOX_H} rx={3} fill="#F9FAFB" stroke="#D1D5DB" strokeWidth={1} strokeDasharray="5,3"/>
      <text x={x+w/2} y={y+MID} textAnchor="middle" dominantBaseline="central" fontSize={8} fill="#9CA3AF" fontFamily="sans-serif">{label||"TBD"}</text>
    </g>
  );
}

function renderQuad(q,qi,hlTeam,teams) {
  const {side,lay}=QUAD_CFG[qi],isRight=side==="right";
  const r1x=isRight?R_R1X:L_R1X,r16x=isRight?R_R16X:L_R16X;
  const qfx=isRight?R_QFX:L_QFX,sfx=isRight?R_SFX:L_SFX;
  const r1e=isRight?r1x:r1x+BOX_W,r16e=isRight?r16x+BOX_W:r16x;
  const qfe=isRight?qfx+BOX_W:qfx,sfe=isRight?sfx+BOX_W:sfx;
  const gap=8,e1=isRight?r1x-gap:r1x+BOX_W+gap;
  const e2=isRight?r16x+BOX_W+gap:r16x-gap,e3=isRight?qfx+BOX_W+gap:qfx-gap;
  const {p,pmid,byeY,g1Y,g2Y,g3Y,qf1Y,qf2Y,sfY}=lay;
  const els=[]; let k=0;

  q.pairs.forEach((pair,si) => {
    const [aU,aL]=[pair[0],pair[1]],sU=SLOT_UPPERS[qi][si],sL=SLOT_LOWERS[qi][si];
    const uy=p[si],ly=p[si]+BOX_H+PAIR_SEP,midY=pmid[si],tgtY=[g1Y,g2Y,g3Y][si]+MID;
    els.push(<SlotBox key={"u"+qi+si} k={"u"+qi+si} slotNum={sU} assigned={aU||0} bye={false} x={r1x} y={uy} hl={aU===hlTeam} teams={teams}/>);
    els.push(<SlotBox key={"l"+qi+si} k={"l"+qi+si} slotNum={sL} assigned={aL||0} bye={false} x={r1x} y={ly} hl={aL===hlTeam} teams={teams}/>);
    els.push(<SvgLine key={"a"+k} k={"a"+k++} x1={r1e} y1={uy+MID} x2={e1} y2={uy+MID}/>);
    els.push(<SvgLine key={"b"+k} k={"b"+k++} x1={r1e} y1={ly+MID} x2={e1} y2={ly+MID}/>);
    els.push(<SvgLine key={"c"+k} k={"c"+k++} x1={e1} y1={uy+MID} x2={e1} y2={ly+MID}/>);
    els.push(<SvgLine key={"d"+k} k={"d"+k++} x1={e1} y1={midY} x2={r16e} y2={tgtY}/>);
  });

  const bT=teams.find(t=>t.seed===q.bye);
  const bSh=bT?bT.shift:"",bBg=bSh?SHIFT_BG[bSh]:"#F9FAFB",bBd=bSh?SHIFT_BORDER[bSh]:"#D1D5DB",bFc=bSh?SHIFT_TEXT[bSh]:"#9CA3AF";
  els.push(
    <g key={"bye"+qi}>
      <rect x={r16x} y={byeY} width={BOX_W} height={BOX_H} rx={3} fill={bBg} stroke={bBd} strokeWidth={1}/>
      <rect x={r16x} y={byeY} width={18} height={BOX_H} rx={0} fill={bSh?SHIFT_BORDER[bSh]:"#6B7280"} opacity={0.85}/>
      <rect x={r16x+3} y={byeY} width={15} height={BOX_H} rx={0} fill={bSh?SHIFT_BORDER[bSh]:"#6B7280"} opacity={0.85}/>
      <text x={r16x+9} y={byeY+MID} textAnchor="middle" dominantBaseline="central" fontSize={8} fontWeight="bold" fill="#fff" fontFamily="sans-serif">{q.bye}</text>
      <text x={r16x+23} y={byeY+9} textAnchor="start" dominantBaseline="central" fontSize={9} fill={bFc} fontFamily="sans-serif">{bT?bT.name+" BYE":"BYE"}</text>
      <text x={r16x+23} y={byeY+19} textAnchor="start" dominantBaseline="central" fontSize={7} fill={bSh?SHIFT_TEXT[bSh]+"99":"#9CA3AF"} fontFamily="sans-serif">seed {q.bye}</text>
    </g>
  );
  els.push(<SvgLine key={"bd"+k} k={"bd"+k++} x1={r16x+BOX_W/2} y1={byeY+BOX_H} x2={r16x+BOX_W/2} y2={g1Y}/>);
  const pl=q.pairs.map(pr => pr[0]?`W(${pr[0]}/${pr[1]||"?"})` : "TBD");
  els.push(<FutureBox key={"g1"+qi} k={"g1"+qi} x={r16x} y={g1Y} label={pl[0]}/>);
  els.push(<FutureBox key={"g2"+qi} k={"g2"+qi} x={r16x} y={g2Y} label={pl[1]}/>);
  els.push(<FutureBox key={"g3"+qi} k={"g3"+qi} x={r16x} y={g3Y} label={pl[2]}/>);
  [[r16e,byeY+MID,e2,byeY+MID],[r16e,g1Y+MID,e2,g1Y+MID],[e2,byeY+MID,e2,g1Y+MID],[e2,(byeY+MID+g1Y+MID)/2,qfe,qf1Y+MID],
   [r16e,g2Y+MID,e2,g2Y+MID],[r16e,g3Y+MID,e2,g3Y+MID],[e2,g2Y+MID,e2,g3Y+MID],[e2,(g2Y+MID+g3Y+MID)/2,qfe,qf2Y+MID]
